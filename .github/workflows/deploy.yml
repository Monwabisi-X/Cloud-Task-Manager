name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

env:
  AWS_REGION: af-south-1
  ASG_NAME: cloud-task-manager-asg
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cloud-task-manager

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "sha_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Debug secret length
        run: |
          echo "Role ARN length: ${#ROLE_ARN}"
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get in-service instance IDs
        id: instances
        run: |
          IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)
          if [ -z "$IDS" ]; then
            echo "No in-service instances found in $ASG_NAME"; exit 1
          fi
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

      - name: Get target group ARN
        id: tg
        run: |
          ARN=$(aws elbv2 describe-target-groups \
            --names cloud-task-manager-tg \
            --query "TargetGroups[0].TargetGroupArn" --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Rolling deploy, one instance at a time
        env:
          TG_ARN: ${{ steps.tg.outputs.arn }}
        run: |
          set -euo pipefail
          for ID in ${{ steps.instances.outputs.ids }}; do
            echo "=== Deploying to $ID ==="

            CMD_ID=$(aws ssm send-command \
              --instance-ids "$ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["cd /opt/cloud-task-manager && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d"]' \
              --query "Command.CommandId" --output text)

            echo "Waiting for SSM command $CMD_ID to finish on $ID..."
            for i in $(seq 1 20); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$CMD_ID" --instance-id "$ID" \
                --query "Status" --output text 2>/dev/null || echo "Pending")
              echo "  command status: $STATUS"
              case "$STATUS" in
                Success) break ;;
                Failed|Cancelled|TimedOut)
                  echo "Deploy command failed on $ID"
                  aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
                    --query "StandardErrorContent" --output text
                  exit 1
                  ;;
              esac
              sleep 10
            done

            echo "Waiting for $ID to report healthy in the target group..."
            HEALTHY="false"
            for i in $(seq 1 20); do
              HEALTH=$(aws elbv2 describe-target-health \
                --target-group-arn "$TG_ARN" --targets Id="$ID" \
                --query "TargetHealthDescriptions[0].TargetHealth.State" --output text)
              echo "  health: $HEALTH"
              if [ "$HEALTH" == "healthy" ]; then HEALTHY="true"; break; fi
              sleep 15
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "Instance $ID did not become healthy after deploy — stopping rollout"
              exit 1
            fi

            echo "=== $ID deployed and healthy, moving to next instance ==="
          done
