# Reference copy for local testing of the published image. The actual file
# used on EC2 is generated by terraform/templates/user_data.sh.tpl at boot
# time with the real image name baked in.
services:
  web:
    image: ${DOCKERHUB_IMAGE:-yourdockerhubuser/cloud-task-manager}:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "5000:5000"
    restart: unless-stopped
